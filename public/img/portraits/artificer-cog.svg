<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <title>The Cog</title>
  <defs>
    <linearGradient id="air" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#cfeaf8"/>
      <stop offset="1" stop-color="#9fd0ec"/>
    </linearGradient>
  </defs>
  <rect width="96" height="96" fill="url(#air)"/>
  <!-- eight teeth about a wheel -->
  <g transform="translate(48 48)" fill="#b8862f" stroke="#7a4d14" stroke-width="2.500" stroke-linejoin="round">
    <rect x="-7" y="-38" width="14" height="16" rx="2"/>
    <rect x="-7" y="-38" width="14" height="16" rx="2" transform="rotate(45)"/>
    <rect x="-7" y="-38" width="14" height="16" rx="2" transform="rotate(90)"/>
    <rect x="-7" y="-38" width="14" height="16" rx="2" transform="rotate(135)"/>
    <rect x="-7" y="-38" width="14" height="16" rx="2" transform="rotate(180)"/>
    <rect x="-7" y="-38" width="14" height="16" rx="2" transform="rotate(225)"/>
    <rect x="-7" y="-38" width="14" height="16" rx="2" transform="rotate(270)"/>
    <rect x="-7" y="-38" width="14" height="16" rx="2" transform="rotate(315)"/>
    <circle r="27" fill="#f1c64a"/>
    <circle r="18" fill="#b8862f"/>
  </g>
  <!-- the stone at its hub -->
  <circle cx="48" cy="48" r="9" fill="#e9f5fb" stroke="#7a4d14" stroke-width="2.500"/>
  <circle cx="45" cy="45" r="2.500" fill="#fff"/>
</svg>
