<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <title>The Raven</title>
  <defs>
    <linearGradient id="pit" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34115c"/>
      <stop offset="1" stop-color="#13061f"/>
    </linearGradient>
  </defs>
  <rect width="96" height="96" fill="url(#pit)"/>
  <!-- a sickly moon -->
  <circle cx="68" cy="26" r="17" fill="#39ff14" fill-opacity=".22"/>
  <circle cx="68" cy="26" r="11" fill="#39ff14" fill-opacity=".3"/>
  <!-- the raven, in profile, upon a branch -->
  <path d="M10 80c22-4 50-4 78 0" fill="none" stroke="#39ff14" stroke-width="3" stroke-linecap="round"/>
  <path d="M60 22c9 0 15 6 15 14l13 6-14 3c-2 8-7 15-14 20l4 14H46l2-9c-12 2-24-2-36-12 12 0 22-4 28-12 3-14 9-24 20-24z" fill="#0c0714" stroke="#39ff14" stroke-width="2" stroke-linejoin="round"/>
  <path d="M30 60c8 0 16-4 22-12" fill="none" stroke="#39ff14" stroke-width="1.500" stroke-linecap="round" stroke-opacity=".6"/>
  <!-- its eye -->
  <circle cx="64" cy="33" r="3" fill="#e01235"/>
  <circle cx="64" cy="33" r="1.100" fill="#0c0714"/>
</svg>
