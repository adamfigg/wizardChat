<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <title>The Mortar and Pestle</title>
  <rect width="96" height="96" fill="#2c1a0e"/>
  <circle cx="76" cy="22" r="26" fill="#17431f" fill-opacity=".75"/>
  <circle cx="18" cy="76" r="28" fill="#5a1616" fill-opacity=".7"/>
  <!-- the pestle -->
  <path d="M50 46l22-30" fill="none" stroke="#6e4a26" stroke-width="12" stroke-linecap="round"/>
  <path d="M50 46l22-30" fill="none" stroke="#d9a45a" stroke-width="7" stroke-linecap="round"/>
  <!-- the mortar -->
  <path d="M18 44h60c0 20-12 34-30 34S18 64 18 44z" fill="#8a6234" stroke="#f0e2c8" stroke-width="3" stroke-linejoin="round"/>
  <rect x="14" y="40" width="68" height="8" rx="4" fill="#a87a44" stroke="#f0e2c8" stroke-width="3"/>
  <rect x="32" y="78" width="32" height="8" rx="3" fill="#8a6234" stroke="#f0e2c8" stroke-width="3"/>
